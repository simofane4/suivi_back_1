openapi: 3.0.3
info:
  title: Suivi Cabinet API
  version: 2.0.0
  description: 'Clinic management backend: cabinets, staff, patients, appointments,
    prescriptions and billing.'
paths:
  /api/:
    get:
      operationId: root_retrieve
      description: Index of the main resources.
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/actes-demandes/:
    get:
      operationId: actes_demandes_list
      description: |-
        Filter `get_queryset` down to the caller's cabinet.

        Set `cabinet_field` on the view to the path from this model to its cabinet,
        or override `scope_queryset` when the relation is not a simple field.
      parameters:
      - in: query
        name: cabinet
        schema:
          type: integer
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - in: query
        name: title
        schema:
          type: string
      tags:
      - actes-demandes
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActeDemanderList'
          description: ''
    post:
      operationId: actes_demandes_create
      description: |-
        Filter `get_queryset` down to the caller's cabinet.

        Set `cabinet_field` on the view to the path from this model to its cabinet,
        or override `scope_queryset` when the relation is not a simple field.
      tags:
      - actes-demandes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActeDemanderRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ActeDemanderRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ActeDemanderRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActeDemander'
          description: ''
