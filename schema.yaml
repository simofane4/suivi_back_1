  /api/appointments/:
    get:
      operationId: appointments_list
      description: |-
        Appointments of the caller's cabinet.

        Overlap detection runs in `AppointmentSerializer.validate`, so it returns a
        400 with the conflicting range instead of the previous 201.
      parameters:
      - in: query
        name: cabinet
        schema:
          type: integer
      - in: query
        name: date
        schema:
          type: string
          format: date
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - in: query
        name: patient
        schema:
          type: integer
      - in: query
        name: payed
        schema:
          type: boolean
      tags:
      - appointments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAppointmentList'
          description: ''
