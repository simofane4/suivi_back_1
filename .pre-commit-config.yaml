repos:
  # Code formatting with Black
  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        language_version: python3.11
        args: ["--line-length=100"]

  # Linting and import sorting with Ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.2.1
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # Type checking with Mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies:
          - django-stubs==4.2.7
          - djangorestframework-stubs==3.14.5
          - types-pillow==10.2.0.20240520
          - types-python-dateutil
        args: ["--ignore-missing-imports", "--no-implicit-optional"]
        exclude: "migrations/|tests/"

  # YAML linting
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-json
      - id: check-merge-conflict
      - id: debug-statements
      - id: mixed-line-ending
      - id: name-tests-test
        args: ["--django"]

  # Docstring checking
  - repo: https://github.com/PyCQA/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        exclude: "migrations/|tests/|__pycache__"
        args: ["--ignore=D100,D104,D105"]

  # Security checking
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        exclude: "tests/|migrations/"
        args: ["-ll", "-i", "-x"]

ci:
  autofix_commit_msg: "fix: auto-fixes from pre-commit.com hooks\n\nfor more information, see https://pre-commit.ci"
  autofix_prs: true
  autoupdate_commit_msg: "deps(pre-commit): update pre-commit.com hooks"
  autoupdate_schedule: weekly
  skip: [mypy]  # Mypy can be slow in CI
  submodules: false
