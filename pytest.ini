[pytest]
DJANGO_SETTINGS_MODULE = suivi_back.settings.dev
django_find_project = false
python_files = test_*.py *_test.py tests.py
python_classes = Test* *Tests
python_functions = test_*
addopts = --strict-markers --tb=short --disable-warnings -v --nomigrations
testpaths = tests
norecursedirs = .git .venv venv build dist __pycache__ staticfiles media

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    e2e: marks tests as end-to-end tests
    django_db: marks tests that access the database

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
