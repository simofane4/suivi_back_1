services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - /app/__pycache__
      - /app/.pytest_cache
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=suivi_back.settings.dev
      - DJANGO_DEBUG=True
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
      - DJANGO_CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:4200,http://localhost:5173
      - DJANGO_DB_PATH=/app/db.sqlite3
      - DJANGO_TIME_ZONE=Africa/Casablanca
      - DJANGO_LANGUAGE_CODE=fr
    env_file:
      - .env.dev
    stdin_open: true
    tty: true

